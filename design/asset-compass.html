<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>资产观察台 · Asset Compass</title><style>html,body{margin:0;min-width:0;background:light-dark(#f5f5ef,#181f1c);color-scheme:light dark}body{min-height:100vh}</style></head><body>
<div id="asset-compass" lang="zh-CN">
  <header class="ac-header">
    <div class="ac-bar">
      <div class="ac-brand"><span class="ac-logo" aria-hidden="true"></span><span>Asset Compass</span></div>
      <nav class="ac-nav" aria-label="主导航">
        <button type="button" class="ac-nav-current" data-action="overview">总览</button>
        <button type="button" data-action="detail">详情</button>
      </nav>
      <div class="ac-snapshot"><span class="ac-status-dot"></span>示例快照<span class="ac-stamp">2026 / 11 / 20</span></div>
    </div>
  </header>
  <main class="ac-main">
    <div id="ac-overview">
    <div class="ac-intro">
      <div><h1>资产观察台</h1><p id="ac-summary"></p></div>
      <button class="ac-primary" type="button" data-action="add"><span aria-hidden="true">＋</span> 添加标的</button>
    </div>
    <div class="ac-panels">
      <section class="ac-chart-card" aria-labelledby="ac-chart-title">
        <div class="ac-chart-head"><div><h2 id="ac-chart-title">跨资产走势</h2><p class="ac-caption">同一起点的区间涨跌幅</p></div>
          <div class="ac-periods" aria-label="对比时间范围">
            <button type="button" data-range="1">1 月</button><button type="button" data-range="3" aria-pressed="true">3 月</button><button type="button" data-range="6">6 月</button>
          </div>
        </div>
        <div id="ac-legend" class="ac-legend"></div>
        <div class="ac-plot"><canvas id="ac-lines" role="img" aria-label="区间涨跌幅折线图"></canvas><output id="ac-tooltip" hidden></output></div>
        <div class="ac-chart-foot"><span id="ac-chart-dates"></span><button class="ac-text-btn" type="button" data-action="compare"><span aria-hidden="true">⇄</span> 调整对比</button></div>
      </section>
      <section class="ac-feature" aria-label="焦点观察">
        <div class="ac-feature-top"><span class="ac-focus-label"><i aria-hidden="true"></i> 焦点观察</span><button type="button" class="ac-focus-open" data-action="focus-detail">查看详情 ↗</button></div>
        <h2 id="ac-focus-name">半导体板块</h2><div id="ac-focus-meta" class="ac-focus-meta"></div>
        <div class="ac-art"><canvas id="ac-instrument" aria-hidden="true"></canvas></div>
        <div id="ac-focus-stats" class="ac-focus-stats"></div>
      </section>
    </div>
    <section class="ac-list" id="ac-watch" aria-labelledby="ac-watch-title">
      <div class="ac-list-head"><div class="ac-list-title"><h2 id="ac-watch-title">我的关注</h2><span id="ac-count"></span></div><div class="ac-filters" aria-label="按类别筛选" id="ac-filters"></div></div>
      <table class="ac-table">
        <thead><tr><th scope="col">标的名称</th><th class="ac-category-col" scope="col">类别</th><th class="ac-trend-col" scope="col">近 30 日走势</th><th class="ac-number-col" scope="col">近 3 月涨跌</th><th class="ac-vol-col ac-number-col" scope="col">60 日波动率</th><th class="ac-method-col" scope="col">观察方法</th><th scope="col"><span class="ac-sr">查看详情</span></th></tr></thead>
        <tbody id="ac-rows"></tbody>
      </table>
    </section>
    </div>
    <section id="ac-detail-page" aria-label="资产详情" hidden>
      <div class="ac-detail-layout">
        <aside class="ac-side"><div class="ac-side-head"><h2>我的关注</h2><button type="button" data-action="add" aria-label="添加关注标的">＋</button></div>
          <nav aria-label="切换详情标的" id="ac-side-assets"></nav>
        </aside>
        <div class="ac-detail-main">
          <div class="ac-detail-head"><div><p class="ac-ticker" id="ac-detail-meta"></p><h1 id="ac-detail-title"></h1></div>
            <div class="ac-periods" id="ac-detail-periods" aria-label="详情时间范围">
              <button type="button" data-detail-range="1">1 月</button><button type="button" data-detail-range="3">3 月</button><button type="button" data-detail-range="6">6 月</button><button type="button" data-detail-range="12">1 年</button>
            </div>
          </div>
          <section class="ac-analysis" aria-label="公式与趋势">
            <div class="ac-model"><div class="ac-model-head"><div><p class="ac-model-label">观察公式</p><h2 id="ac-model-name"></h2></div><div class="ac-result" id="ac-model-result"></div></div>
              <p id="ac-equation"></p><div id="ac-factors"></div><p id="ac-evaluation"></p>
            </div>
            <div class="ac-trend"><div class="ac-trend-head"><h2>走势与模型</h2><span id="ac-detail-dates"></span></div>
              <div class="ac-readouts" id="ac-readouts"></div>
              <div class="ac-detail-plot"><canvas id="ac-overlay" role="img" aria-label="标的走势与模型历史值"></canvas><output class="ac-plot-tip" id="ac-overlay-tip" hidden></output><span id="ac-empty-detail" hidden>暂无行情，接入数据后显示走势。</span></div>
              <input type="range" min="0" value="0" step="1" id="ac-crosshair" aria-label="查看指定日期的走势与公式">
              <div class="ac-chart-note"><span id="ac-sync-day"></span> <button type="button" class="ac-text-btn" data-action="latest" hidden>回到最新</button></div>
            </div>
          </section>
          <button class="ac-text-btn ac-pin" type="button" data-action="pin-detail">设为总览焦点</button>
        </div>
      </div>
    </section>
  </main>
  <dialog class="ac-dialog" id="ac-dialog" aria-labelledby="ac-dialog-title">
    <div class="ac-dialog-head"><h2 id="ac-dialog-title"></h2><button aria-label="关闭" type="button" class="ac-close" data-action="close">×</button></div>
    <div id="ac-dialog-content"></div>
  </dialog>
  <span class="ac-sr" id="ac-notice" role="status"></span>
</div>
<style>
#asset-compass {
  color-scheme: light dark;
  --paper:light-dark(#f5f5ef,#181f1c); --surface:light-dark(#fffffc,#222b26);
  --ink:light-dark(#162e25,#e3eee5); --text:light-dark(#34433b,#d8e0d9);
  --muted:light-dark(#647269,#a5b6a8); --line:light-dark(#daddd2,#39483c);
  --soft:light-dark(#eef1e9,#2e3930); --active:light-dark(#dce9d7,#405243);
  --up:light-dark(#b63d34,#ff9d93); --down:light-dark(#167247,#83d6a6);
  --cta:light-dark(#174a37,#bde3ac); --on-cta:light-dark(#fff,#183326);
  --body-font:"DM Sans","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --digits:"IBM Plex Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  width:100%; min-width:0; margin:0; background:var(--paper); color:var(--text); font:14px/1.5 var(--body-font); text-align:left;
  -webkit-font-smoothing:antialiased;
}
#asset-compass *, #asset-compass *::before, #asset-compass *::after {box-sizing:border-box;}
#asset-compass [hidden]{display:none!important}
#asset-compass h1,#asset-compass h2,#asset-compass h3,#asset-compass p{margin:0;}
#asset-compass button,#asset-compass input,#asset-compass select{font:inherit;color:inherit;}
#asset-compass button{background:none;border:0;padding:0;cursor:pointer;font-weight:500;}
#asset-compass button:focus-visible,#asset-compass input:focus-visible,#asset-compass select:focus-visible{outline:3px solid #869e42;outline-offset:3px;}
#asset-compass h1,#asset-compass h2,#asset-compass h3{color:var(--ink)}
#asset-compass .ac-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
#asset-compass .ac-bar,#asset-compass .ac-main{max-width:1376px;margin:0 auto;padding-left:4.5%;padding-right:4.5%;}
#asset-compass .ac-header{border-bottom:1px solid var(--line);background:var(--surface);}
#asset-compass .ac-bar{height:70px;display:flex;align-items:center;}
#asset-compass .ac-brand{display:flex;align-items:center;color:var(--ink);font:600 24px/1 "DM Sans","Helvetica Neue",Arial,sans-serif;letter-spacing:-1.35px;white-space:nowrap;}
#asset-compass .ac-logo{width:34px;height:34px;margin-right:10px;position:relative;display:block;border-radius:50%;background:#194b38;transform:rotate(29deg);}
#asset-compass .ac-logo::before,#asset-compass .ac-logo::after{content:"";position:absolute;left:12px;width:10px;height:13px;}
#asset-compass .ac-logo::before{top:4px;clip-path:polygon(50% 0,100% 100%,0 100%);background:#d3ef98;}
#asset-compass .ac-logo::after{bottom:4px;clip-path:polygon(0 0,100% 0,50% 100%);background:#f4f5df;}
#asset-compass .ac-nav{align-self:stretch;display:flex;margin-left:52px;}
#asset-compass .ac-nav button{margin-right:28px;color:var(--muted);position:relative;font-size:14px;}
#asset-compass .ac-nav .ac-nav-current{color:var(--ink);font-weight:650;}
#asset-compass .ac-nav .ac-nav-current::after{content:"";position:absolute;bottom:0;height:3px;left:0;right:0;background:var(--cta);border-radius:2px;}
#asset-compass .ac-snapshot{display:flex;align-items:center;margin-left:auto;white-space:nowrap;color:var(--muted);font-size:12px;}
#asset-compass .ac-status-dot{background:#6a9160;border-radius:100%;width:7px;height:7px;margin-right:8px;}
#asset-compass .ac-stamp{margin-left:15px;padding-left:15px;border-left:1px solid var(--line);font:12px var(--digits);color:var(--text);}
#asset-compass .ac-main{padding-bottom:30px;}
#asset-compass .ac-intro{display:flex;align-items:center;justify-content:space-between;padding:32px 0 24px;}
#asset-compass h1{font-size:clamp(30px,3vw,42px);font-weight:670;line-height:1.25;letter-spacing:-1.9px;}
#asset-compass .ac-intro p{color:var(--muted);font-size:13px;margin-top:7px;}
#asset-compass button.ac-primary{background:var(--cta);color:var(--on-cta);border-radius:8px;padding:10px 17px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;}
#asset-compass .ac-primary span{font:20px/1 var(--body-font);margin-right:6px;}
#asset-compass .ac-primary:hover{filter:brightness(1.10);}
#asset-compass .ac-panels{display:flex;align-items:stretch;}
#asset-compass .ac-chart-card,#asset-compass .ac-list{background:var(--surface);border:1px solid var(--line);border-radius:14px;}
#asset-compass .ac-chart-card{flex:2.12;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
#asset-compass .ac-chart-head{display:flex;align-items:center;justify-content:space-between;padding:22px 25px 0;}
#asset-compass h2{font-size:21px;letter-spacing:-.65px;line-height:1.4;font-weight:640;}
#asset-compass .ac-caption{color:var(--muted);font-size:12px;margin-top:3px;}
#asset-compass .ac-periods{display:flex;border:1px solid var(--line);background:var(--soft);border-radius:7px;padding:3px;}
#asset-compass .ac-periods button{min-width:42px;padding:3px 6px;font-size:12px;border-radius:4px;color:var(--muted);white-space:nowrap;}
#asset-compass .ac-periods [aria-pressed="true"]{color:var(--ink);background:var(--surface);box-shadow:0 1px 4px #0002;font-weight:650;}
#asset-compass .ac-legend{display:flex;margin:18px 25px 9px;min-height:45px;}
#asset-compass .ac-key{padding-right:25px;min-width:0;}
#asset-compass .ac-key + .ac-key{border-left:1px solid var(--line);padding-left:24px;}
#asset-compass .ac-key-name{font-size:12px;font-weight:500;color:var(--text);display:flex;align-items:center;white-space:nowrap;}
#asset-compass .ac-swatch{width:9px;height:9px;border-radius:50%;margin-right:7px;flex:none;}
#asset-compass .ac-key strong{display:block;color:var(--ink);font:500 clamp(18px,1.76vw,25px)/1.3 var(--digits);letter-spacing:-1.4px;margin-top:3px;white-space:nowrap;}
#asset-compass .ac-plot{height:176px;margin:1px 23px 4px 19px;position:relative;}
#asset-compass .ac-plot canvas,#asset-compass .ac-art canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
#asset-compass #ac-tooltip{position:absolute;pointer-events:none;top:4px;background:var(--surface);color:var(--text);border:1px solid var(--line);padding:7px 9px;line-height:1.6;font:12px/1.6 var(--digits);white-space:pre;border-radius:6px;box-shadow:0 3px 12px #0001;}
#asset-compass .ac-chart-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding:8px 25px 11px;border-top:1px solid var(--line);color:var(--muted);}
#asset-compass #ac-chart-dates{font:11px/1.6 var(--digits);}
#asset-compass .ac-text-btn{font-size:12px;color:var(--up);}
#asset-compass .ac-text-btn span{margin-right:3px;font-size:16px;}
#asset-compass .ac-feature{margin-left:17px;position:relative;isolation:isolate;flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column;padding:21px 24px 18px;border-radius:14px;background:radial-gradient(ellipse at 76% 47%,#275a43 0%,#184532 48%,#123a2c 89%);color:#edf4e7;}
#asset-compass .ac-feature-top{display:flex;align-items:center;justify-content:space-between;min-height:25px;}
#asset-compass .ac-focus-label{display:flex;align-items:center;color:#d4e5d5;font-size:12px;font-weight:520;}
#asset-compass .ac-focus-label i{border:1px solid #c2dc9e;display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;position:relative;}
#asset-compass .ac-focus-label i::after{content:"";position:absolute;inset:2px;border-radius:50%;background:#c8e697;}
#asset-compass .ac-feature h2{color:#f0f5e7;font-size:29px;margin-top:8px;line-height:1.25;letter-spacing:-1.3px;}
#asset-compass .ac-focus-meta{margin-top:4px;color:#bbd0bd;font:12px/1.6 var(--digits);}
#asset-compass .ac-round-btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #80a78b88;border-radius:50%;width:28px;height:28px;color:#e4edd8;font-size:18px;}
#asset-compass .ac-art{flex:1;position:relative;min-height:136px;margin:0 -24px;}
#asset-compass .ac-focus-stats{display:flex;padding-top:14px;border-top:1px solid #a2bf9a45;}
#asset-compass .ac-focus-stats div{width:50%;}
#asset-compass .ac-focus-stats div+div{border-left:1px solid #a2bf9a45;padding-left:20px;}
#asset-compass .ac-focus-stats small{display:block;font-size:11px;color:#bed4c1;margin-bottom:3px;}
#asset-compass .ac-focus-stats strong{color:#e7f2ce;font:500 23px/1.25 var(--digits);letter-spacing:-1.2px;}
#asset-compass .ac-list{margin-top:22px;overflow:hidden;}
#asset-compass .ac-list-head{display:flex;align-items:center;justify-content:space-between;padding:18px 23px;}
#asset-compass .ac-list-title,#asset-compass .ac-filters{display:flex;align-items:center;}
#asset-compass .ac-list-title span{margin-left:9px;border-radius:6px;padding:1px 7px;background:var(--soft);font:12px/1.6 var(--digits);color:var(--muted);}
#asset-compass .ac-filters button{padding:4px 11px;margin-left:3px;border-radius:6px;color:var(--muted);font-size:12px;}
#asset-compass .ac-filters [aria-pressed="true"]{background:var(--soft);color:var(--ink);font-weight:650;}
#asset-compass .ac-table{width:100%;border-collapse:collapse;table-layout:auto;font-size:13px;margin:0;}
#asset-compass .ac-table th,#asset-compass .ac-table td{border:0;text-align:left;vertical-align:middle;padding:8px 11px;}
#asset-compass .ac-table th{font-weight:500;color:var(--muted);font-size:11px;background:var(--soft);height:32px;white-space:nowrap;}
#asset-compass .ac-table tr>*:first-child{padding-left:24px;}
#asset-compass .ac-table tr>*:last-child{padding-right:20px;width:40px;}
#asset-compass .ac-table tbody tr+tr{border-top:1px solid var(--line);}
#asset-compass .ac-table tbody tr:hover{background:var(--soft);}
#asset-compass .ac-table .ac-number-col{text-align:right;}
#asset-compass .ac-table .ac-method-col{padding-left:5%;}
#asset-compass .ac-asset-btn{display:flex;align-items:center;text-align:left;min-height:37px;max-width:100%;}
#asset-compass .ac-glyph{display:inline-block;flex:none;width:36px;height:36px;border-radius:10px;margin-right:11px;}
#asset-compass .ac-asset-label{min-width:0;display:flex;flex-direction:column;}
#asset-compass .ac-asset-name{font-size:14px;font-weight:620;color:var(--ink);overflow-wrap:anywhere;}
#asset-compass .ac-symbol{color:var(--muted);font:10.8px/1.5 var(--digits);letter-spacing:.35px;}
#asset-compass .ac-tag{background:var(--soft);color:var(--text);padding:3px 8px;border-radius:5px;font-size:11px;white-space:nowrap;}
#asset-compass .ac-spark{display:block;width:92px;height:26px;}
#asset-compass td.ac-number-col{font:13.5px var(--digits);white-space:nowrap;}
#asset-compass .ac-pos{color:var(--up);}
#asset-compass .ac-neg{color:var(--down);}
#asset-compass .ac-method{color:var(--muted);font-size:12px;white-space:nowrap;}
#asset-compass .ac-row-more{width:24px;height:30px;color:var(--muted);font-size:18px;}
#asset-compass .ac-dialog{width:min(430px,calc(100% - 28px));padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);max-height:85vh;overflow:auto;box-shadow:0 14px 60px #102b2030;}
#asset-compass .ac-dialog::backdrop{background:#0b201a66;}
#asset-compass .ac-dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
#asset-compass .ac-close{border-radius:50%;background:var(--soft);font-size:20px;width:29px;height:29px;}
#asset-compass .ac-fields label{display:block;font-size:13px;margin:13px 0;}
#asset-compass .ac-fields input,#asset-compass .ac-fields select{display:block;width:100%;margin-top:5px;padding:9px 10px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;}
#asset-compass .ac-dialog p,#asset-compass .ac-dialog .ac-details{color:var(--muted);font-size:13px;line-height:1.7;}
#asset-compass .ac-dialog .ac-details{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);}
#asset-compass .ac-details b{color:var(--text);font-weight:550;}
#asset-compass .ac-dialog h3{font-size:15px;margin:13px 0 3px;}
#asset-compass .ac-dialog .ac-actions{display:flex;justify-content:flex-end;margin-top:18px;}
#asset-compass .ac-choice{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:10px 0;}
#asset-compass .ac-choice input{margin:0 10px 0 1px;accent-color:var(--cta);width:16px;height:16px;}
#asset-compass .ac-choice small{margin-left:auto;color:var(--muted);font:12px var(--digits);}
#asset-compass .ac-error{color:var(--down);font-size:12px;}
@media(max-width:1050px){
  #asset-compass .ac-bar,#asset-compass .ac-main{padding-left:3%;padding-right:3%;}
  #asset-compass .ac-key{padding-right:13px;}#asset-compass .ac-key + .ac-key{padding-left:13px;}
  #asset-compass .ac-table .ac-method-col{padding-left:18px;}
}
@media(max-width:780px){
  #asset-compass .ac-bar,#asset-compass .ac-main{padding-left:18px;padding-right:18px;}
  #asset-compass .ac-nav{margin-left:25px;}#asset-compass .ac-nav button{margin-right:16px;}
  #asset-compass .ac-stamp{display:none;}#asset-compass .ac-feature{padding-left:17px;padding-right:17px;margin-left:10px;}
  #asset-compass .ac-chart-head{padding:17px 16px 0;}#asset-compass .ac-legend{margin-left:16px;margin-right:10px;}
  #asset-compass .ac-plot{margin-left:8px;margin-right:10px;}#asset-compass .ac-chart-foot{padding-left:14px;padding-right:14px;}
  #asset-compass .ac-feature h2{font-size:24px;}#asset-compass .ac-focus-stats strong{font-size:19px;}#asset-compass .ac-focus-stats div+div{padding-left:10px;}
  #asset-compass .ac-trend-col{display:none;}#asset-compass .ac-list-head{padding:15px;}#asset-compass .ac-table tr>*:first-child{padding-left:15px;}
}
@media(max-width:640px){
  #asset-compass .ac-bar{height:auto;min-height:55px;flex-wrap:wrap;padding-top:13px;}#asset-compass .ac-brand{font-size:21px;}
  #asset-compass .ac-logo{width:30px;height:30px;}#asset-compass .ac-logo::before,#asset-compass .ac-logo::after{left:10px;height:11px;}
  #asset-compass .ac-nav{order:3;width:100%;margin:8px 0 0;}#asset-compass .ac-nav button{padding:7px 0 9px;margin-right:24px;}
  #asset-compass .ac-intro{padding:21px 0 17px;}#asset-compass .ac-intro p{font-size:12px;}
  #asset-compass .ac-panels{display:block;}#asset-compass .ac-feature{margin:12px 0 0;min-height:180px;padding:15px 19px;}
  #asset-compass .ac-art{position:absolute;z-index:-1;width:49%;height:130px;min-height:0;right:0;top:25px;margin:0;}
  #asset-compass .ac-focus-stats{width:52%;margin-top:14px;padding-top:8px;}#asset-compass .ac-focus-stats strong{font-size:17px;}
  #asset-compass .ac-list-head{flex-wrap:wrap;}#asset-compass .ac-filters{flex-wrap:wrap;}#asset-compass .ac-filters button{padding:4px 7px;}
  #asset-compass .ac-category-col,#asset-compass .ac-method-col{display:none;}#asset-compass .ac-table td,#asset-compass .ac-table th{padding:7px;}
  #asset-compass .ac-asset-name{font-size:13px;}#asset-compass td.ac-number-col{font-size:12px;}#asset-compass .ac-glyph{width:29px;height:29px;margin-right:6px;}
  #asset-compass .ac-table tr>*:last-child{width:22px;padding-right:5px;padding-left:0;}
}
@media(max-width:400px){

    const x=i=>l+(r-l)*i/(n-1), y=v=>bottom-(v-low)/(high-low)*(bottom-top);
    const muted=theme.matches?'#abbaaf':'#68766d', grid=theme.matches?'#36463b':'#e4e8df';
    ctx.font='11px Menlo,Consolas,monospace';ctx.fillStyle=muted;ctx.textBaseline='middle';ctx.textAlign='right';
    for(let tick=low;tick<high+step*.1;tick+=step) {
      const py=y(tick);
      path(ctx,[[l,py],[r,py]],null,Math.abs(tick)<0.001?(theme.matches?'#5a705e':'#c0c9bd'):grid,1,false);
      ctx.fillStyle=muted;ctx.fillText(Number(tick.toFixed(1))+'%',l-7,py);
    }
    const ticks=w<400?4:6;
    for(let i=0;i<ticks;i++) {
      const index=Math.round(i*(n-1)/(ticks-1));
      ctx.textAlign=i===0?'left':i===ticks-1?'right':'center';ctx.fillStyle=muted;ctx.fillText(dates[start+index].slice(5).replace('-','/'),x(index),h-8);
    }
    ctx.lineCap='round';ctx.lineJoin='round';
    for(let i=series.length-1;i>=0;i--) {
      const points=curves[i].map((v,j)=>[x(j),y(v)]), color=colorOf(series[i]);
      if(i===0) {
        const fade=ctx.createLinearGradient(0,top,0,bottom);fade.addColorStop(0,color+'27');fade.addColorStop(1,color+'00');
        path(ctx,[...points,[r,bottom],[l,bottom]],fade);
      }
      path(ctx,points,null,color,i===0?2.45:1.95,false);
      const last=points.at(-1);ctx.beginPath();ctx.arc(last[0],last[1],2.8,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
    }
    plotGeometry={l,r,n,start};
    const tip=byId('ac-tooltip');
    if(hoverIndex!==null && hoverIndex<n) {
      const px=x(hoverIndex);path(ctx,[[px,top],[px,bottom]],null,muted,1,false);
      series.forEach((a,i)=>{ctx.beginPath();ctx.arc(px,y(curves[i][hoverIndex]),3.4,0,Math.PI*2);ctx.fillStyle=colorOf(a);ctx.fill();});
      tip.textContent=[dates[start+hoverIndex],...series.map((a,i)=>a.id+'  '+pct(curves[i][hoverIndex]))].join('\n');
      tip.hidden=false;tip.style.left=Math.max(0,Math.min(w-tip.offsetWidth,px>w*.54?px-tip.offsetWidth-7:px+7))+'px';
    } else tip.hidden=true;
    canvas.setAttribute('aria-label',state.months+'个月示例涨跌幅，'+series.map((a,i)=>a.name+' '+pct(curves[i].at(-1))).join('，'));
  }
  // Isometric instrument illustration. Plane coordinates keep artwork crisp at every card size.
  function instrument() {
    const area=canvasContext(byId('ac-instrument'));if(!area) return;
    const {ctx,w,h}=area, focus=getAsset(state.focus);
    const unit=Math.min(w/294,h/145);
    ctx.translate(w*.52,h*.53);ctx.scale(unit,unit);
    const iso=(u,v,z=0)=>[(u-v)*.9,(u+v)*.395-z];
    const face=(corners,fill,stroke,width)=>path(ctx,corners.map(p=>iso(...p)),fill,stroke,width);
    const plane=(size,z,color,edge)=>face([[-size,-size,z],[size,-size,z],[size,size,z],[-size,size,z]],color,edge);
    const track=(pts,ink,width=1)=>path(ctx,pts.map(p=>iso(...p)),null,ink,width,false);
    for(let i=-200;i<=200;i+=20) {
      track([[i,-210,-7],[i,210,-7]],'#b9e3ac0d');track([[-210,i,-7],[210,i,-7]],'#b9e3ac0d');
    }
    for(let k=0;k<10;k++) {
      const base=-45+k*10, offset=12+(k%4)*7, reach=100+(k%5)*18;
      for(const side of [-1,1]) {
        const route=[[side*49,base,-4],[side*(60+offset),base,-4],[side*(72+offset),base+(k%2?12:-12),-4],[side*reach,base+(k%2?12:-12),-4]];
        track(route,k%3===0?'#b0ca8290':'#9abb7960',.9);
        const pt=iso(...route.at(-1));ctx.beginPath();ctx.arc(pt[0],pt[1],1.5,0,Math.PI*2);ctx.fillStyle='#bdd68d';ctx.fill();
        if(k%2===0) track(route.map(([u,v,z])=>[v,u,z]),'#9abb7977',.9);
      }
    }
    if(focus.icon==='chip') {
      function slab(size,z,thickness,top,left,right,edge) {
        face([[-size,size,z],[size,size,z],[size,size,z-thickness],[-size,size,z-thickness]],left,'#456545',.55);
        face([[size,-size,z],[size,size,z],[size,size,z-thickness],[size,-size,z-thickness]],right,'#456545',.55);
        plane(size,z,top,edge);
      }
      slab(52,2,6,'#385e47','#244b39','#315440','#9ab488');
      for(let p=-43;p<=43;p+=6) {
        for(const side of [-1,1]) {
          face([[p,side*40,5],[p+2.7,side*40,5],[p+2.7,side*51,4],[p,side*51,4]],'#bbcf8e','#e3eeb2',.4);
          face([[side*40,p,5],[side*40,p+2.7,5],[side*51,p+2.7,4],[side*51,p,4]],'#a8bf7c','#e1edb7',.4);
        }
      }
      const patina=ctx.createLinearGradient(-60,-45,60,30);patina.addColorStop(0,'#e6f3aa');patina.addColorStop(.50,'#c2d995');patina.addColorStop(1,'#8aaa70');
      slab(40,15,11,patina,'#708755','#527449','#e1f3b0');
      plane(34,15.4,null,'#819c67');slab(25,19,3,'#517450','#849b6a','#6e8c5d','#d5e5a5');
      const tiles=[[-20,-20,-2,0],[1,-20,20,-8],[1,-5,20,7],[-20,3,-6,20],[-3,10,20,20]];
      tiles.forEach(([u,v,a,b],i)=>{
        face([[u,v,19.2],[a,v,19.2],[a,b,19.2],[u,b,19.2]],i%2?'#9bb77c':'#adc68a','#e0e9ac',.5);
        for(let t=u+2;t<a;t+=3)track([[t,v+1,19.4],[t,b-1,19.4]],'#6d8d62',.5);
      });
      [[-31,-30],[-31,30],[30,-31],[30,30]].forEach(([u,v])=>{const p=iso(u,v,15.5);ctx.fillStyle='#73925c';ctx.beginPath();ctx.ellipse(p[0],p[1],1.8,1,0,0,2*Math.PI);ctx.fill();});
    } else {
      ctx.save();ctx.scale(1,.56);
      for(let r=56;r<=73;r+=8){ctx.beginPath();ctx.arc(0,0,r,0,2*Math.PI);ctx.strokeStyle='#aac78e';ctx.lineWidth=1;ctx.stroke();}
      for(let i=0;i<36;i++){const a=i*Math.PI/18;path(ctx,[[64*Math.cos(a),64*Math.sin(a)],[70*Math.cos(a),70*Math.sin(a)]],null,'#b0c79a',1,false);}
      ctx.rotate(.45);path(ctx,[[0,-67],[13,0],[-13,0]],'#d6eba3');path(ctx,[[-13,0],[13,0],[0,67]],'#8aaa75');
      ctx.restore();
    }
  }

    const rule=a.id==='GLD'?'黄金每跑赢一个期限得 0.5 分。美债按期初模拟年利率和实际持有天数折算。2 年期利率低于有效联邦基金利率得 1 分。':'';
    byId('ac-sync-day').textContent=observation?'拖动时间轴可查看当天的公式。'+rule:'';

  function drawDetail() {
    const canvas=byId('ac-overlay'),area=canvasContext(canvas);if(!area)return;
    const {ctx,w,h}=area;
    if(!detailRows.length){detailScale=null;canvas.setAttribute('aria-label','暂无行情');return;}
    const left=w<360?39:46,right=w-(w<360?45:53),top=12,bottom=h-25;
    const observation=detailRows[detailIndex], model=observation.model;
    const n=detailRows.length, values=detailRows.map(r=>r.ret), signals=detailRows.map(r=>r.model.value);
    function domain(data,zero=true) {
      const lo=zero?Math.min(0,...data):Math.min(...data),hi=zero?Math.max(0,...data):Math.max(...data);
      const rough=(hi-lo)/4||1,order=10**Math.floor(Math.log10(rough));
      const tick=([1,2,2.5,5,10].find(m=>m*order>=rough)||10)*order;
      return [Math.floor(lo/tick)*tick,Math.max(Math.ceil(hi/tick)*tick,Math.floor(lo/tick)*tick+tick),tick];
    }
    const isPosition=state.selected==='GLD';
    const priceDomain=domain(values),modelDomain=isPosition?[0,100,25]:domain(signals);
    const x=i=>left+(right-left)*i/(n-1);
    const y=(v,limits)=>bottom-(v-limits[0])/(limits[1]-limits[0])*(bottom-top);
    const neutral=theme.matches?'#adbaae':'#67756b',modelColor=theme.matches?'#e1bb69':'#997022',grid=theme.matches?'#39453b':'#e1e6dd';
    ctx.font='11px Menlo,Consolas,monospace';ctx.textBaseline='middle';
    function axis(bounds,isLeft) {
      for(let v=bounds[0];v<=bounds[1]+.001;v+=bounds[2]) {
        const py=y(v,bounds);
        if(isLeft)path(ctx,[[left,py],[right,py]],null,Math.abs(v)<.001?neutral:grid,Math.abs(v)<.001?.8:1,false);
        ctx.textAlign=isLeft?'right':'left';ctx.fillStyle=isLeft?neutral:modelColor;
        const unit=isLeft||model.unit==='%'?'%':'';
        ctx.fillText(Number(v.toFixed(1))+unit,isLeft?left-6:right+6,py);
      }
    }
    axis(priceDomain,true);axis(modelDomain,false);
    const trendPoints=values.map((v,i)=>[x(i),y(v,priceDomain)]),zero=y(0,priceDomain);
    for(const sign of [1,-1]) {
      ctx.save();ctx.beginPath();ctx.rect(left-2,sign>0?top-2:zero,right-left+4,sign>0?zero-top+2:bottom-zero+2);ctx.clip();
      const color=marketColor(sign);path(ctx,[...trendPoints,[right,zero],[left,zero]],color+'10');
      ctx.lineJoin='round';path(ctx,trendPoints,null,color,2.2,false);ctx.restore();
    }
    const signalPoints=[];
    signals.forEach((v,i)=>{
      if(i&&isPosition)signalPoints.push([x(i),y(signals[i-1],modelDomain)]);
      signalPoints.push([x(i),y(v,modelDomain)]);
    });
    ctx.setLineDash([5,3]);path(ctx,signalPoints,null,modelColor,1.8,false);ctx.setLineDash([]);
    const ticks=w<470?4:6;
    for(let i=0;i<ticks;i++){
      const j=Math.round((n-1)*i/(ticks-1));ctx.fillStyle=neutral;ctx.textAlign=i===0?'left':i===ticks-1?'right':'center';
      ctx.fillText(detailRows[j].date.slice(5).replace('-','/'),x(j),h-8);
    }
    const px=x(detailIndex);
    ctx.setLineDash([2,3]);path(ctx,[[px,top],[px,bottom]],null,neutral,1,false);ctx.setLineDash([]);
    [[y(observation.ret,priceDomain),marketColor(observation.ret)],[y(model.value,modelDomain),modelColor]].forEach(([py,color])=>{
      ctx.beginPath();ctx.arc(px,py,3.5,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
    });
    canvas.setAttribute('aria-label',observation.date+'，'+getAsset(state.selected).name+'区间涨跌 '+pct(observation.ret)+'，'+model.label+' '+model.value.toFixed(2)+model.unit);
    detailScale={left,right,n};
  }

      try {history.pushState(null,'',hash);} catch {location.hash=hash;}

    if(b.dataset.detail){navigate('detail',b.dataset.detail);root.querySelector('#ac-side-assets [aria-current="true"]').focus({preventScroll:true});return;}

    } else return;
    dialog.close();refresh();save();
    if(form.id==='ac-add-form')navigate('detail',String(fields.get('code')).trim().toUpperCase());
  });
  byId('ac-crosshair').addEventListener('input',e=>{detailIndex=Number(e.target.value);updateDetail();});
  function pointDetail(e) {
    if(!detailScale || !detailRows.length)return;
    const {left,right,n}=detailScale,px=e.clientX-e.currentTarget.getBoundingClientRect().left;
    const i=Math.max(0,Math.min(n-1,Math.round((px-left)/(right-left)*(n-1))));
    if(i!==detailIndex){detailIndex=i;updateDetail();}
    const row=detailRows[i],tip=byId('ac-overlay-tip');
    tip.textContent=dated(row.date)+'\n区间涨跌 '+pct(row.ret)+'\n'+row.model.label+' '+row.model.value.toFixed(2)+row.model.unit;
    tip.hidden=false;
    tip.style.left=Math.max(0,Math.min(e.currentTarget.clientWidth-tip.offsetWidth,px>right*.65?px-tip.offsetWidth-8:px+8))+'px';
  }
  byId('ac-overlay').addEventListener('pointermove',pointDetail);
  byId('ac-overlay').addEventListener('pointerdown',pointDetail);
  byId('ac-overlay').addEventListener('pointerleave',()=>{byId('ac-overlay-tip').hidden=true;});
  const lines=byId('ac-lines');
  lines.addEventListener('pointermove',e=>{
    if(!plotGeometry)return;
    const {l,r,n}=plotGeometry, px=e.clientX-lines.getBoundingClientRect().left;
    hoverIndex=Math.max(0,Math.min(n-1,Math.round((px-l)/(r-l)*(n-1))));plot();
  });
  lines.addEventListener('pointerleave',()=>{hoverIndex=null;plot();});
  dialog.addEventListener('click',e=>{
    if(e.target!==dialog)return;
    const box=dialog.getBoundingClientRect();
    if(e.clientX<box.left||e.clientX>box.right||e.clientY<box.top||e.clientY>box.bottom)dialog.close();
  });
  let resizeFrame;
  const onResize=()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{paintRows();if(page==='detail')drawDetail();else{plot();instrument();}});};
  new ResizeObserver(onResize).observe(root);
  theme.addEventListener('change',refresh);
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState?.privateContent){restore(e.detail.globals.widgetState.privateContent);refresh();}});
  readRoute();
})();
</script>
